name: Update VPN subscription

on:
  schedule:
    # дважды в час, на некруглых минутах: очередь Actions короче
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow an expected drop in the number of working servers
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "collect.py"
      - "probe.py"
      - "outbound.py"
      - "clashout.py"
      - "notify.py"
      - "geo.py"
      - "install_singbox.py"
      - "runtests.py"
      - "testregressions.py"
      - "sources.txt"
      - ".github/workflows/update.yml"

# два прогона не должны писать в репозиторий одновременно
concurrency:
  group: update-subscription
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: python install_singbox.py

      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run Python tests
        run: python runtests.py --require-singbox

      # история, прошлый stats.json и гео-кэш лежат в ветке data
      - name: Подтягиваю историю из ветки data
        run: |
          set -euo pipefail
          mkdir -p output
          DATA_REF=$(git ls-remote --heads origin refs/heads/data)
          if [ -z "$DATA_REF" ]; then
            echo "The data branch does not exist yet; starting the first snapshot."
            exit 0
          fi
          git fetch --depth=1 origin data
          take() {
            if git show "FETCH_HEAD:$1" > "$1.tmp" 2>/dev/null && [ -s "$1.tmp" ]; then
              mv "$1.tmp" "$1"
              echo "взял $1 из ветки data"
            else
              rm -f "$1.tmp"
            fi
          }
          take output/history.json
          take output/stats.json
          take geo_cache.json

      # ulimit должен стоять в этом же шаге: каждый run в своей оболочке
      - name: Collect configs
        id: collect
        env:
          # без секретов просто ничего не отправляет
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: |
          ulimit -n 65535 || true
          python collect.py

      - name: Show result
        if: always()
        run: |
          if [ -f output/stats.json ]; then
            cat output/stats.json
          else
            echo "stats.json отсутствует"
          fi

      # ветка data перезаписывается целиком: плоская история, репозиторий не растёт
      - name: Опубликовать данные в ветку data
        if: steps.collect.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAIN=$(python -c "import json;print(json.load(open('output/stats.json'))['published'])")
          FULL=$(python -c "import json;d=json.load(open('output/stats.json'));print(d.get('published_full', d['published']))")

          git rm -r --quiet --cached .
          git add --force output
          if [ -f geo_cache.json ]; then
            git add --force geo_cache.json
          fi
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "data: ${MAIN}/${FULL} узлов, $(date -u '+%Y-%m-%d %H:%M') UTC")

          for attempt in 1 2 3 4 5; do
            if git push --force origin "$COMMIT:refs/heads/data"; then
              echo "Данные опубликованы: ${MAIN}/${FULL} узлов."
              exit 0
            fi
            echo "push отклонён (попытка $attempt) — пробую снова."
            sleep $((attempt * 3))
          done

          echo "Не удалось запушить ветку data за 5 попыток."
          exit 1
