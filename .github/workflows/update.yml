name: Update VPN subscription

on:
  schedule:
    # Каждый час в 07 минут. UTC.
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collect.py"
      - "sources.txt"
      - ".github/workflows/update.yml"

# Не даём двум прогонам писать в репозиторий одновременно.
concurrency:
  group: update-subscription
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python selftest.py

      - name: Run end-to-end test
        run: python e2etest.py

      - name: Collect configs
        id: collect
        run: python collect.py

      - name: Show result
        if: always()
        run: |
          if [ -f output/stats.json ]; then
            cat output/stats.json
          else
            echo "stats.json отсутствует"
          fi

      - name: Commit and push
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A output/

          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен."
            exit 0
          fi

          COUNT=$(python -c "import json;print(json.load(open('output/stats.json'))['published'])")
          git commit -m "auto: обновление подписки — ${COUNT} узлов [skip ci]"

          # На случай, если параллельный прогон уже успел запушить.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push не удался, пробую снова ($i)"
            git pull --rebase --autostash
            sleep 5
          done
          exit 1
