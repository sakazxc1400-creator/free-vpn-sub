name: Update Subscriptions

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore / Save Geo Cache
        uses: actions/cache@v4
        with:
          path: geo_cache.json
          key: geo-cache-${{ github.run_id }}
          restore-keys: |
            geo-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp aiohttp-socks

      - name: Run collector
        run: |
          python collect.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          force_orphan: true
