name: Update VPN subscription

on:
  schedule:
    # Каждый час в 07 минут. UTC.
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collect.py"
      - "sources.txt"
      - ".github/workflows/update.yml"

# Не даём двум прогонам писать в репозиторий одновременно.
concurrency:
  group: update-subscription
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python selftest.py

      - name: Run end-to-end test
        run: python e2etest.py

      - name: Collect configs
        id: collect
        run: python collect.py

      - name: Show result
        if: always()
        run: |
          if [ -f output/stats.json ]; then
            cat output/stats.json
          else
            echo "stats.json отсутствует"
          fi

      - name: Commit and push
        if: steps.collect.outcome == 'success'
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COUNT=$(python -c "import json;print(json.load(open('output/stats.json'))['published'])")

          # output/ — полностью генерируемый каталог. При гонке двух прогонов
          # мержить его содержимое бессмысленно: нужен свежий результат целиком.
          # Поэтому сохраняем файлы, перечитываем remote и накладываем заново.
          cp -r output "$RUNNER_TEMP/output-fresh"

          for attempt in 1 2 3 4 5; do
            git add -A output/
            if git diff --cached --quiet; then
              echo "Изменений нет — коммит не нужен."
              exit 0
            fi

            git commit -m "auto: обновление подписки — ${COUNT} узлов [skip ci]"

            if git push; then
              echo "Запушено с попытки $attempt."
              exit 0
            fi

            echo "push отклонён (попытка $attempt) — синхронизируюсь с remote."
            git reset --soft HEAD~1
            git restore --staged output/ 2>/dev/null || git reset output/
            git fetch origin main
            # Берём remote как основу, затем возвращаем свежий output/.
            git reset --hard origin/main
            rm -rf output
            cp -r "$RUNNER_TEMP/output-fresh" output
            sleep $((attempt * 3))
          done

          echo "Не удалось запушить за 5 попыток."
          exit 1
