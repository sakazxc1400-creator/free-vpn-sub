name: Tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "site/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML==6.0.2
      - run: python install_singbox.py
      - run: python runtests.py --require-singbox

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: docs/
